spring:
  application:
    name: Codingtest study service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway로만 바꿔요 (계획 4.3)
    properties:
      hibernate.jdbc.time_zone: UTC # 저장은 UTC (D7)
  session:
    timeout: 30d # ADR-002
    jdbc:
      initialize-schema: never # 테이블은 Flyway V1이 만들어요
  security:
    oauth2:
      client:
        registration:
          github: # 개발용·운영용 GitHub App의 Client ID/secret (ADR-002). 기본값 없음: 빠지면 기동 실패
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
  mvc:
    problemdetails:
      enabled: true # 오류 응답은 application/problem+json (계획 4.4)

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health # 외부 노출은 health만 (9.7)
