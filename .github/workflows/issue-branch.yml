# 이슈를 assign하면 develop에서 `<타입>/<이슈번호>-<영문 설명>` 브랜치를 만들고 이슈에 댓글로 알려요 (CONTRIBUTING 2장).
# 문제가 있으면 잡을 실패시키지 않고 이유를 이슈 댓글로 남겨요.
name: Issue branch

on:
  issues:
    types: [assigned]

permissions:
  contents: write # 브랜치 생성
  issues: write # 댓글

jobs:
  create-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 같은 이슈에 assign이 연달아 와도 하나씩 처리해요.
    concurrency: issue-branch-${{ github.event.issue.number }}
    steps:
      - name: 브랜치 만들기
        # 이슈 제목·본문·라벨은 사용자가 쓴 값이라 ${{ }}로 스크립트에 넣지 않고 env로만 넘겨요 (스크립트 인젝션 방지).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          BODY: ${{ github.event.issue.body }}
          BASE_BRANCH: develop
        run: |
          retry='고친 뒤 assign을 해제했다가 다시 하면 브랜치를 다시 만들어요.'
          fail() { gh issue comment "$NUMBER" --body "브랜치를 만들지 못했어요: $1 $retry"; exit 0; }

          # 1. type 라벨은 정확히 하나여야 해요.
          types=$(jq -r '.[] | select(startswith("type: ")) | sub("^type: "; "")' <<<"$LABELS")
          if [ "$(grep -c . <<<"$types")" -ne 1 ]; then
            fail "\`type:\` 라벨이 정확히 하나여야 해요 (지금: $(echo ${types:-없음}))."
          fi

          # 2. 라벨을 브랜치 타입으로 바꿔요.
          case "$types" in
            feature) type=feat ;;
            bug) type=fix ;;
            experiment) type=exp ;;
            chore) type=chore ;;
            docs) type=docs ;;
            *) fail "\`type: $types\` 라벨에 맞는 브랜치 타입이 없어요." ;;
          esac

          # 3. 이슈 폼의 '브랜치 설명 (영문)' 칸 다음의 첫 번째 비어 있지 않은 줄을 읽어요.
          desc=$(awk '/^### 브랜치 설명 \(영문\)/ { found = 1; next } found && /^###/ { exit } found && NF { print; exit }' <<<"$BODY" \
            | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-')
          if ! [[ "$desc" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            fail "'브랜치 설명 (영문)' 칸이 비었거나 영문 소문자·숫자·- 말고 다른 글자가 있어요 (지금: \`${desc:-비어 있음}\`)."
          fi

          branch="$type/$NUMBER-$desc"

          # 4. 이미 있으면 만들지 않아요.
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            fail "\`$branch\` 브랜치가 이미 있어요."
          fi

          # 5. develop의 최신 커밋에서 브랜치를 만들어요.
          if ! sha=$(gh api "repos/$GH_REPO/git/ref/heads/$BASE_BRANCH" --jq .object.sha 2>/dev/null); then
            fail "\`$BASE_BRANCH\` 브랜치가 없어요. 먼저 만들어 주세요."
          fi
          if ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" --silent; then
            fail "GitHub API 오류예요. Actions 로그를 확인해 주세요."
          fi

          gh issue comment "$NUMBER" --body "$(printf '브랜치를 만들었어요: `%s`\n\n```sh\ngit fetch origin\ngit switch %s\n```' "$branch" "$branch")"
