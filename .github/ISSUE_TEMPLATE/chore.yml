name: 작업
description: 설정, 의존성, CI, 리팩터링 같은 기능 밖의 일
labels: ["type: chore"]
body:
  - type: input
    id: branch
    attributes:
      label: 브랜치 설명 (영문)
      description: "이슈를 assign하면 `<타입>/<이슈번호>-<이 값>` 브랜치가 자동으로 생겨요. 영문 소문자, 숫자, -만 써요."
      placeholder: ci-gradle-cache
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 무엇을 왜
      description: 무엇을 바꾸고, 안 하면 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 할 일
      description: 작업을 체크리스트로 쪼개요. 1~3세션을 넘으면 이슈를 나눠요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: "확인할 수 있는 조건으로 써요. (예: CI 빌드 시간이 5분 안으로 줄어든다)"
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 관련 문서
      description: 계획 장, ADR 번호
