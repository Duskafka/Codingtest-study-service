name: 실험
description: 측정해서 비교하고 결정하는 일 (성능, 처리 방식, 알림 효과 등)
labels: ["type: experiment"]
body:
  - type: textarea
    id: question
    attributes:
      label: 알고 싶은 것
      description: "이 실험이 답할 질문 하나. (예: 웹훅을 inbox + 워커로 바꾸면 누락이 줄어드나?)"
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 가설
      description: 결과를 예상해서 미리 적어요. 실험 뒤에 맞았는지 비교해요.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: 측정 방법
      description: 무엇을(지표), 어떤 도구로, 어떤 조건에서(환경, 데이터 양, 부하, 반복 횟수) 재나요?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 판단 기준
      description: 어떤 결과면 바꾸고, 어떤 결과면 그대로 두나요?
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: 결과 기록 위치
      placeholder: docs/experiments/...
